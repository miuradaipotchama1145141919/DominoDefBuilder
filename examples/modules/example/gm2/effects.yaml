tables:
  - id: 20
    entries:
      0: Small Room
      1: Medium Room
      2: Large Room
      3: Medium Hall
      4: Large Hall
      8: Plate
  - id: 21
    entries:
      0: Chorus 1
      1: Chorus 2
      2: Chorus 3
      3: Chorus 4
      4: FB Chorus
      5: Flanger

items:
  - type: folder
    name: Reverb
    id: 30
    items:
      - type: ccm
        id: 300
        name: Reverb Type
        value:
          default: 4
          max: 8
          tableId: 20
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 01H 00H #VL F7H"
      - type: ccm
        id: 301
        name: Reverb Time
        value: {default: 64, max: 127, name: Time}
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 01H 01H #VL F7H"
      - type: ccmLink
        id: 300
        value: 4
  - type: folder
    name: Chorus
    id: 31
    items:
      - type: ccm
        id: 302
        name: Chorus Type
        value:
          default: 2
          max: 5
          tableId: 21
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 02H 00H #VL F7H"
      - type: ccm
        id: 303
        name: Chorus Mod Rate
        value: {default: 3, max: 127, name: 0.122 Hz/step}
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 02H 01H #VL F7H"
      - type: ccm
        id: 304
        name: Chorus Mod Depth
        value: {default: 19, max: 127, name: peak-to-peak ms}
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 02H 02H #VL F7H"
      - type: ccm
        id: 305
        name: Chorus Feedback
        value: {default: 8, max: 127, name: Percent}
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 02H 03H #VL F7H"
      - type: ccm
        id: 306
        name: Chorus Send to Reverb
        value: {default: 0, max: 127, name: Percent}
        data: "@SYSEX F0H 7FH 7FH 04H 05H 01H 01H 01H 01H 02H 04H #VL F7H"
      - type: folderLink
        id: 30
        name: Reverb Controls Copy
      - type: folderLink
        id: 31
        name: Chorus Controls Copy
