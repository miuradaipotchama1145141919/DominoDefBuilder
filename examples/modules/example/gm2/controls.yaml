tables:
  - id: 1
    entries:
      0: "Off"
      127: "On"
  - id: 2
    entries:
      0: Left
      64: Center
      127: Right

items:
  - type: folder
    name: Channel Controls
    id: 10
    items:
      - type: ccm
        id: 1
        name: Modulation Depth
        value: {default: 0, max: 127}
        data: "@CC 1 #VL"
      - type: ccm
        id: 5
        name: Portamento Time
        value: {default: 0, max: 127}
        data: "@CC 5 #VL"
      - type: ccm
        id: 7
        name: Channel Volume
        sync: Last
        value: {default: 100, max: 127}
        data: "@CC 7 #VL"
      - type: ccm
        id: 10
        name: Pan
        sync: Last
        value: {default: 0, min: -64, max: 63, offset: 64, name: Position}
