      - type: ccm
        id: 134
        name: Channel Coarse Tuning
        value: {default: 0, min: -64, max: 63, offset: 64, name: Semitones}
        data: "@RPN 00H 02H #VL #NONE"
      - type: ccm
        id: 135
        name: Modulation Depth Range
        value: {default: 64, max: 8191, name: RPN 00H/05H}
        data: "@RPN 00H 05H #VL #VH"
      - type: ccmLink
        id: 7
        value: 90
  - type: folder
    name: Universal System Messages
    items:
      - type: ccm
        id: 200
        name: GM2 System On
        sync: Last
        data: "@SYSEX F0H 7EH 7FH 09H 03H F7H"
      - type: ccm
        id: 201
        name: GM1 System On
        sync: Last
        data: "@SYSEX F0H 7EH 7FH 09H 01H F7H"
      - type: ccm
        id: 202
        name: GM System Off
        sync: Last
        data: "@SYSEX F0H 7EH 7FH 09H 02H F7H"
      - type: ccm
        id: 203
        name: Master Volume
        sync: Last
        value: {default: 16383, max: 16383}
        data: "@SYSEX F0H 7FH 7FH 04H 01H #VL #VH F7H"
      - type: ccm
        id: 204
        name: Master Fine Tuning
        sync: Last
        value: {default: 0, min: -8192, max: 8191, offset: 8192, name: 14-bit tuning}
        data: "@SYSEX F0H 7FH 7FH 04H 03H #VL #VH F7H"
      - type: ccm
        id: 205
        name: Master Coarse Tuning
        sync: Last
        value: {default: 0, min: -64, max: 63, offset: 64, name: Semitones}
        data: "@SYSEX F0H 7FH 7FH 04H 04H 00H #VL F7H"
  - type: folder
    name: Controller Destination
    items:
      - type: ccm
        id: 220
        name: Channel Pressure Destination Example
        sync: Last
        memo: "GM2 required Controller Destination Setting example."
        data: "@SYSEX F0H 7FH 7FH 09H 01H #CH 00H 42H 01H 60H 05H 20H F7H"
      - type: ccm
        id: 221
        name: CC Destination Example
        sync: Last
        memo: "GM2 required Controller Destination Setting example using General Purpose Controller 1."
        data: "@SYSEX F0H 7FH 7FH 09H 03H #CH 10H 00H 42H 01H 60H 05H 20H F7H"
  - type: folder
    name: Key-Based Drum Controllers
    items:
      - type: ccm
        id: 230
        name: Drum Volume
        sync: LastEachGate
        value: {default: 64, min: 0, max: 127}
        gate: {default: 36, min: 27, max: 87, type: Key, name: Note}
        memo: "GM2 Key-Based Instrument Controller example for per-note percussion volume."
        data: "@SYSEX F0H 7FH 7FH 0AH 01H #CH #GL 07H #VL F7H"
      - type: ccm
        id: 231
        name: Drum Pan
        sync: LastEachGate
        value: {default: 64, max: 127}
        gate: {default: 36, min: 27, max: 87, type: Key, name: Note}
        data: "@SYSEX F0H 7FH 7FH 0AH 01H #CH #GL 0AH #VL F7H"
      - type: ccm
        id: 232
        name: Drum Reverb Send
        sync: LastEachGate
        value: {default: 0, max: 127}
        gate: {default: 36, min: 27, max: 87, type: Key, name: Note}
        data: "@SYSEX F0H 7FH 7FH 0AH 01H #CH #GL 5BH #VL F7H"
      - type: ccm
        id: 233
        name: Drum Chorus Send
        sync: LastEachGate
        value: {default: 0, max: 127}
        gate: {default: 36, min: 27, max: 87, type: Key, name: Note}
        data: "@SYSEX F0H 7FH 7FH 0AH 01H #CH #GL 5DH #VL F7H"
