name: pypi

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/DominoDefBuilder/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match __version__ $version" >&2
            exit 1
          fi
      - run: pip install build twine ".[dev]"
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7 # keep paired with download-artifact@v8 below
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/DominoDefBuilder/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
