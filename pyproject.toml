[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "DominoDefBuilder"
dynamic = ["version"]
description = "Build Domino sound source definition XML files from YAML sources"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "miuradaipotchama1145141919" }]
keywords = ["domino", "midi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/miuradaipotchama1145141919/DominoDefBuilder"
Repository = "https://github.com/miuradaipotchama1145141919/DominoDefBuilder"
Issues = "https://github.com/miuradaipotchama1145141919/DominoDefBuilder/issues"

[project.scripts]
def = "DominoDefBuilder.cli:main"
dominodef = "DominoDefBuilder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["DominoDefBuilder*"]

[tool.setuptools.dynamic]
version = { attr = "DominoDefBuilder.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
